[project]
name = "ansible-playbook"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ansible-core",
    "boto3",
    "botocore",
]

[dependency-groups]
ansible-test = [
    "ansible-lint",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"